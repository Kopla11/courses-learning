function dateLocal(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){const now=dateLocal(),todays=ALL.filter(t=>t.date===now),pending=ALL.filter(t=>!isDone(t)),next=pending.filter(t=>t.date>=now).sort((a,b)=>a.date.localeCompare(b.date)),overdue=pending.filter(t=>t.date<now);const shown=todays.length?todays:next.slice(0,5);return `<h1 class="page-title">Today / My Learning</h1><p class="muted">${esc(now)} · 学习资源与完成状态分开管理</p><div class="metric-grid"><div class="metric"><span class="muted">今日计划任务</span><strong>${todays.length}</strong></div><div class="metric"><span class="muted">今日完成</span><strong>${todays.filter(isDone).length}/${todays.length}</strong></div><div class="metric"><span class="muted">尚未完成的历史任务</span><strong>${overdue.length}</strong></div></div><div class="today-header"><h2>${todays.length?'今天的学习安排':'下一个学习日的任务'}</h2><p class="study-tip">点击「学习资料」只会打开资源；只有点击「完成今日课程」并确认后，才会记录完成状态。</p>${shown.length?shown.map(taskRow).join(''):'<div class="empty">当前没有待办任务。</div>'}</div><div class="section-title"><h2>Upcoming / 接下来</h2><button class="btn" data-go="calendar">查看日历</button></div><div class="card">${next.filter(t=>!shown.some(x=>x.id===t.id)).slice(0,8).map(taskRow).join('')||'<div class="empty">暂无后续任务</div>'}</div></div>`}
function analytics(){const completed=ALL.filter(isDone),totalMins=completed.reduce((sum,t)=>sum+(Number(t.mins)||0),0),courseMetrics=PLAN.courses.map(c=>{const ts=ALL.filter(t=>t.course===c.id);return {c,ts,done:ts.filter(isDone).length,mins:ts.filter(isDone).reduce((a,t)=>a+(Number(t.mins)||0),0)}});const weekly=PLAN.weeks.map(w=>{const ts=ALL.filter(t=>t.week===w.n);return {week:w.n,done:ts.filter(isDone).length,total:ts.length}});return `<h1 class="page-title">Learning Analytics</h1><p class="muted">根据你确认完成的任务实时计算；学习时长为任务预估时长，不是实际计时。</p><div class="metric-grid"><div class="metric"><span class="muted">完成任务</span><strong>${completed.length} / ${ALL.length}</strong></div><div class="metric"><span class="muted">总体完成率</span><strong>${percent(completed.length,ALL.length)}%</strong></div><div class="metric"><span class="muted">已完成任务的预估时长</span><strong>${(totalMins/60).toFixed(1)} h</strong></div></div><div class="section-title"><h2>Course Progress / 课程进度</h2></div><div class="card">${courseMetrics.map(({c,ts,done,mins})=>`<div class="analytics-item"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(c.name)}</b><span>${done}/${ts.length} · ${percent(done,ts.length)}%</span></div><div class="analytics-bar"><i style="width:${percent(done,ts.length)}%"></i></div><div class="study-tip">已完成任务的预估学习量：${(mins/60).toFixed(1)} 小时</div></div>`).join('')}</div><div class="section-title"><h2>Weekly Progress / 每周完成率</h2></div><div class="card">${weekly.map(w=>`<div class="analytics-item"><div style="display:flex;justify-content:space-between"><span>Week ${w.week}</span><b>${w.done}/${w.total} · ${percent(w.done,w.total)}%</b></div><div class="analytics-bar"><i style="width:${percent(w.done,w.total)}%"></i></div></div>`).join('')}</div>`}
function lecture(id){const t=ALL.find(x=>x.id===id);if(!t)return '<div class="empty">找不到对应课程任务。</div>';const c=course(t.course);return `<div class="lesson"><div class="muted small">${esc(c?.name||t.course)} / WEEK ${t.week} / ${esc(t.date)}</div><h1 class="page-title">${title(t)}</h1><p class="muted">${esc(t.kind||'学习')} · 预计 ${t.mins||0} 分钟</p><div class="lesson-block"><h3>🎯 Learning Objectives / 学习目标</h3><p>${esc(c?.goal||'完成本节学习内容并记录关键概念。')}</p></div><div class="lesson-block"><h3>📚 Resources / 学习资料</h3><p class="study-tip">打开资料不会自动完成课程。</p>${t.link?`<a class="resource-link" href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">↗ 打开本节学习资源</a>`:'<p class="muted">该任务尚未提供专属链接。</p>'}${(c?.res||[]).map(r=>`<p>${link(r[1],r[0])}</p>`).join('')}</div><div class="lesson-block"><h3>🧪 Practice / 学习要求</h3><p>${esc(t.detail||'学习课程内容，整理核心概念，完成相应练习并记录问题。')}</p></div><div class="lesson-block"><h3>✍️ Lecture Notes</h3><textarea class="note" data-note="lecture:${esc(id)}" placeholder="关键概念、数学推导、代码示例、疑问……">${esc(notes['lecture:'+id]||'')}</textarea></div><div class="lesson-block"><h3>✅ Completion / 完成状态</h3><p class="study-tip">完成学习后点击按钮，将出现确认窗口。</p><button class="task-action ${isDone(t)?'':'primary'}" data-confirm-task="${t.id}">${isDone(t)?'↩ 标记未完成':'✓ 完成今日课程'}</button></div></div>`}

function stats(){let done=ALL.filter(isDone).length;return `<div class="stats"><div class="stat"><span>完成任务</span><strong>${done} / ${ALL.length}</strong>${progress(ALL)}</div><div class="stat"><span>总完成率</span><strong>${percent(done,ALL.length)}%</strong><span>自动根据复选框更新</span></div><div class="stat"><span>学习计划</span><strong>${PLAN.weeks.length} 周</strong><span>6 门课程 · 2026.11 — 2027.05</span></div></div>`}
function home(){let next=ALL.filter(t=>!isDone(t)).slice(0,7);return `<div class="hero"><div class="eyebrow">PERSONAL LEARNING STUDIO</div><h1>Control, Automation & Machine Learning</h1><p>把 MIT、Stanford 和工程项目整合成一个持续学习的空间。</p></div>${stats()}<div class="section-title"><h2>📚 My Courses</h2><span class="muted small">${PLAN.courses.length} courses</span></div><div class="course-grid">${PLAN.courses.map(c=>{let tasks=ALL.filter(t=>t.course===c.id);return `<button class="card course-card" data-go="course/${c.id}">${tag(c.id)}<h3>${esc(c.name)}</h3><div class="muted small">${esc(c.weeks)} · ${tasks.length} tasks</div>${progress(tasks)}<div class="muted small" style="margin-top:8px">${tasks.filter(isDone).length}/${tasks.length} 已完成</div></button>`}).join('')}</div><div class="section-title"><h2>☑ Up Next</h2><button class="btn" data-go="tasks">查看全部任务</button></div><div class="card">${next.map(taskRow).join('')||'<div class="empty">全部任务已完成 🎉</div>'}</div>`}
function schedule(){const weeks=PLAN.weeks;const cols=[weeks.slice(0,13),weeks.slice(13)];return `<h1 class="page-title">Semester Schedule</h1><p class="muted">参考你提供的课程网站：双栏学期时间表，按周展示主题、课程和日期。点击课程主题查看当天学习内容。</p>${stats()}<div class="schedule">${cols.map(ws=>`<div class="schedule-col"><div class="schedule-head"><div></div><div>Monday</div><div>Wednesday</div><div>Friday</div></div>${ws.map(w=>`<div class="weekline"><div class="weeknum">W${w.n}</div>${[0,2,4].map(idx=>{let d=w.days[idx];if(!d)return '<div></div>';let t=d.tasks[0];return `<div class="session"><div class="date">${fmt(d.date)}</div>${t?`<a class="topic" href="#/day/${d.date}">${title(t)}</a><span class="tag">${esc(t.course)}</span>`:'<span class="date">Free / Buffer</span>'}</div>`}).join('')}</div>`).join('')}</div>`).join('')}</div>`}
function calendar(){let q=new URLSearchParams(location.hash.split('?')[1]||'');let ym=q.get('month')||'2026-11';if(!/^\d{4}-\d{2}$/.test(ym))ym='2026-11';let [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;let cells=[];for(let i=0;i<offset;i++)cells.push('<div class="day off"></div>');for(let d=1;d<=last;d++){let iso=`${ym}-${String(d).padStart(2,'0')}`,ts=ALL.filter(t=>t.date===iso);cells.push(`<div class="day" data-go="day/${iso}"><div class="num">${d}</div>${ts.slice(0,2).map(t=>`<span class="mini">${esc(t.title)}</span>`).join('')}${ts.length>2?`<span class="muted small">+${ts.length-2}</span>`:''}</div>`)}let prev=new Date(y,m-2,1),next=new Date(y,m,1),f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return `<h1 class="page-title">Study Calendar</h1><p class="muted">点击日期进入当天的学习页面，日期按真实星期排列。</p><div class="section-title"><div class="actions"><button class="btn" data-go="calendar?month=${f(prev)}">←</button><h2>${y} 年 ${m} 月</h2><button class="btn" data-go="calendar?month=${f(next)}">→</button></div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(s=>`<div class="dayhead">${s}</div>`).join('')}${cells.join('')}</div>`}
function day(iso){let tasks=ALL.filter(t=>t.date===iso);return `<div class="lesson"><div class="muted small">DAILY LEARNING · ${esc(iso)}</div><h1 class="page-title">${esc(iso)} 学习计划</h1><p class="muted">${tasks.length} 项学习任务 · ${tasks.reduce((a,t)=>a+(t.mins||0),0)} 分钟</p><h2 id="today-tasks">🚩 Today's Tasks</h2><div class="card">${tasks.map(taskRow).join('')||'<div class="empty">今天没有安排任务。你可以休息或复习。</div>'}</div><h2 id="daily-notes">📝 Learning Notes</h2><textarea class="note" data-note="day:${esc(iso)}" placeholder="记录公式、推导、代码、难点和今日总结……">${esc(notes['day:'+iso]||'')}</textarea><h2 id="reflection">🧩 Reflection</h2><p class="muted">今天学到了什么？明天要解决哪个问题？</p></div>`}
function coursePage(id){let c=course(id);if(!c)return home();let tasks=ALL.filter(t=>t.course===id),weeks=[...new Set(tasks.map(t=>t.week))];return `<div class="lesson"><div class="muted small">COURSES / ${esc(c.id)}</div><h1 class="page-title">${esc(c.name)}</h1><p class="muted">${esc(c.weeks)} · ${tasks.length} tasks</p>${progress(tasks)}<h2 id="learning-goals">🧩 Learning Goals</h2><p>${esc(c.goal)}</p><h2 id="resources">📚 Learning Resources</h2><div class="card">${c.res.map(r=>`<div class="taskrow">${link(r[1],r[0])}</div>`).join('')}</div><h2 id="course-modules">📌 Course Modules</h2>${weeks.map(n=>{let ts=tasks.filter(t=>t.week===n),w=PLAN.weeks.find(w=>w.n===n);return `<details class="card" style="margin-bottom:12px" ${n===weeks[0]?'open':''}><summary style="cursor:pointer;font-weight:700">Week ${n} · ${esc(w.label)} <span class="muted small">(${ts.filter(isDone).length}/${ts.length})</span></summary><div style="margin-top:12px">${ts.map(taskRow).join('')}</div></details>`}).join('')}<h2 id="course-notes">✍️ My Notes</h2><textarea class="note" data-note="course:${id}" placeholder="知识点、公式、项目思路……">${esc(notes['course:'+id]||'')}</textarea></div>`}
function tasks(){let query=new URLSearchParams(location.hash.split('?')[1]||'');let c=query.get('course')||'',s=query.get('status')||'all',search=query.get('q')||'';let rows=ALL.filter(t=>(!c||t.course===c)&&(s==='all'||(s==='done'?isDone(t):!isDone(t)))&&(!search||t.title.toLowerCase().includes(search.toLowerCase())));return `<h1 class="page-title">Task Database</h1><p class="muted">类似 Notion 的任务数据库。支持课程筛选、状态筛选和搜索。</p>${stats()}<div class="filters"><input class="field" id="searchTasks" value="${esc(search)}" placeholder="搜索任务……"><select class="field" id="filterCourse"><option value="">所有课程</option>${PLAN.courses.map(x=>`<option value="${x.id}" ${c===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select class="field" id="filterStatus"><option value="all">全部状态</option><option value="open" ${s==='open'?'selected':''}>未完成</option><option value="done" ${s==='done'?'selected':''}>已完成</option></select></div><div class="tablewrap"><table><thead><tr><th>Done</th><th>Task</th><th>Course</th><th>Date</th><th>Week</th></tr></thead><tbody>${rows.map(t=>`<tr><td><button class="task-action" data-confirm-task="${t.id}">${isDone(t)?'✓ Done':'Confirm ✓'}</button></td><td><a href="#/day/${t.date}">${title(t)}</a></td><td>${tag(t.course)}</td><td>${t.date}</td><td>W${t.week}</td></tr>`).join('')}</tbody></table></div><p class="muted small">显示 ${rows.length} / ${ALL.length} 个任务</p>`}
function roadmap(){return `<h1 class="page-title">Learning Roadmap</h1><p class="muted">后续学习计划保持原始内容，按学期组织。</p>${PLAN.later.map(term=>`<div class="section-title"><h2>${esc(term.term)}</h2></div><div class="tablewrap"><table><thead><tr><th>Week</th><th>Start</th><th>CCA / Control</th><th>MLE</th></tr></thead><tbody>${term.rows.map(w=>`<tr><td>${w.n}</td><td>${w.start}</td><td>${esc(w.ctrl)}</td><td>${esc(w.mle)}</td></tr>`).join('')}</tbody></table></div>`).join('')}`}
function toc(view){let map={home:[['My Courses','home'],['Up Next','home']],schedule:[['Semester Schedule','schedule']],calendar:[['Study Calendar','calendar']],tasks:[['Task Database','tasks']],roadmap:[['Learning Roadmap','roadmap']]};if(view.startsWith('course/'))return [['Learning Goals','learning-goals'],['Learning Resources','resources'],['Course Modules','course-modules'],['My Notes','course-notes']].map(([t,id])=>`<a href="#${id}" data-scroll="${id}">${t}</a>`).join('');if(view.startsWith('day/'))return [['Today’s Tasks','today-tasks'],['Learning Notes','daily-notes'],['Reflection','reflection']].map(([t,id])=>`<a href="#${id}" data-scroll="${id}">${t}</a>`).join('');return (map[view.split('?')[0]]||[]).map(([t,id])=>`<a href="#/${id}">${t}</a>`).join('')}
function render(){let view=decodeURIComponent(location.hash.replace(/^#\/?/,'')||'home');if(!view||view.startsWith('#'))view='home';let path=view.split('?')[0],html=path==='home'?home():path==='today'?today():path==='analytics'?analytics():path==='schedule'?schedule():path==='calendar'?calendar():path==='tasks'?tasks():path==='roadmap'?roadmap():path.startsWith('course/')?coursePage(path.slice(7)):path.startsWith('lecture/')?lecture(path.slice(8)):path.startsWith('day/')?day(path.slice(4)):home();$('#app').innerHTML=html;$('#crumb').textContent='Learning Studio / '+(path.startsWith('course/')?'Course':path.startsWith('day/')?'Daily Notes':path);$('#toc').innerHTML=toc(path);document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===path));}
$('#courseNav').innerHTML=PLAN.courses.map(c=>`<button class="navbtn" data-go="course/${c.id}">▸ &nbsp; ${esc(c.name)}</button>`).join('');document.addEventListener('click',e=>{let ct=e.target.closest('[data-confirm-task]');if(ct){e.preventDefault();const id=ct.dataset.confirmTask,t=ALL.find(x=>x.id===id);if(!t)return;const currently=isDone(t);const msg=currently?'确认将「'+t.title+'」标记为未完成吗？':'确认已经完成「'+t.title+'」的学习了吗？\n\n学习资料的打开状态不会影响完成记录。';if(window.confirm(msg)){state.done[id]=!currently;save();render()}else{render()}return}let g=e.target.closest('[data-go]');if(g){location.hash='#/'+g.dataset.go;return}let sc=e.target.closest('[data-scroll]');if(sc){e.preventDefault();document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}let toggle=e.target.closest('[data-toggle]');if(toggle){let input=document.querySelector(`input[data-task="${toggle.dataset.toggle}"]`);if(input){state.done[input.dataset.task]=!state.done[input.dataset.task];save();render()}}});document.addEventListener('change',e=>{if(e.target.matches('#filterCourse,#filterStatus'))applyFilters()});function applyFilters(){let q=$('#searchTasks')?.value||'',c=$('#filterCourse')?.value||'',s=$('#filterStatus')?.value||'all';location.hash='#/tasks?'+new URLSearchParams({q,course:c,status:s})}let debounce;document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){notes[e.target.dataset.note]=e.target.value;saveNotes()}if(e.target.matches('#searchTasks')){clearTimeout(debounce);debounce=setTimeout(applyFilters,450)}});$('#themeBtn').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME,document.documentElement.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({done:state.done,notes,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CCA-MLE-learning-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.done||typeof d.done!=='object'||!d.notes||typeof d.notes!=='object')throw Error('Invalid backup');if(!confirm('确定使用备份覆盖当前进度和笔记吗？'))return;state.done=d.done;notes=d.notes;save();saveNotes();render();alert('恢复成功')}catch(err){alert('导入失败：'+err.message)}};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
